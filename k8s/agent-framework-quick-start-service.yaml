apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-framework-quick-start
  labels:
    app: agent-framework-quick-start
  namespace: dotnet-ai
spec:
  replicas: 1
  revisionHistoryLimit: 10
  minReadySeconds: 10
  progressDeadlineSeconds: 600
  selector:
    matchLabels:
      app: agent-framework-quick-start
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: agent-framework-quick-start
        service: agent-framework-quick-start
    spec:
      serviceAccountName: agent-framework-quick-start
      containers:
      - name: agent-framework-quick-start
        image: dotnet-ai/agent-framework-quick-start:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5002
          protocol: TCP
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        envFrom:
        - configMapRef:
            name: agent-framework-quick-start-config
        livenessProbe:
            httpGet:
                path: /health
                port: 5002
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
        readinessProbe:
            httpGet:
                path: /health
                port: 5002
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
        startupProbe:                           
            httpGet:
                path: /health
                port: 5002
            initialDelaySeconds: 0
            periodSeconds: 5
            failureThreshold: 30                 
---
apiVersion: v1
kind: Service
metadata:
  name: agent-framework-quick-start
  labels:
    app: agent-framework-quick-start
    service: agent-framework-quick-start
  namespace: dotnet-ai
spec:
  type: LoadBalancer
  selector:
    app: agent-framework-quick-start
    service: agent-framework-quick-start
  ports:
    - name: "5002"
      port: 5002
      targetPort: 5002
      protocol: TCP