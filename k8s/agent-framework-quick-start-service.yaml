apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-framework-quick-start
  labels:
    app: agent-framework-quick-start
  namespace: dotnet-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-framework-quick-start
  template:
    metadata:
      labels:
        app: agent-framework-quick-start
    spec:
      serviceAccountName: agent-framework-quick-start
      containers:
      - name: agent-framework-quick-start
        image: dotnet-ai/agent-framework-quick-start:latest
        ports:
        - containerPort: 5200
          protocol: TCP
        - containerPort: 5201
          protocol: TCP
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        envFrom:
        - configMapRef:
            name: agent-framework-quick-start-config
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        livenessProbe:
            httpGet:
                path: /health
                port: 5200
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
        readinessProbe:
            httpGet:
                path: /health
                port: 5200
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
        startupProbe:                           
            httpGet:
                path: /health
                port: 5200
            initialDelaySeconds: 0
            periodSeconds: 5
            failureThreshold: 30                 
---
apiVersion: v1
kind: Service
metadata:
  name: agent-framework-quick-start
  labels:
    app: agent-framework-quick-start
  namespace: dotnet-ai
spec:
  type: LoadBalancer
  selector:
    app: agent-framework-quick-start
  ports:
    - name: "5200"
      port: 5200
      targetPort: 5200
    - name: "5201"
      port: 5201
      targetPort: 5201