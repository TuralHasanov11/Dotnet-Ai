apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-app1
  labels:
    app: web-app1
  namespace: dotnet-ai
spec:
  replicas: 1
  revisionHistoryLimit: 10
  minReadySeconds: 10
  progressDeadlineSeconds: 600
  selector:
    matchLabels:
      app: web-app1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: web-app1
        service: web-app1
    spec:
      serviceAccountName: web-app1
      automountServiceAccountToken: false
      containers:
      - name: web-app1
        image: dotnet-ai/webapp1:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
          protocol: TCP
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
            ephemeral-storage: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
            ephemeral-storage: "1Gi"
        envFrom:
        - configMapRef:
            name: web-app1-config
        livenessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 0
          periodSeconds: 5
          failureThreshold: 30
---
apiVersion: v1
kind: Service
metadata:
  name: web-app1
  labels:
    app: web-app1
    service: web-app1
  namespace: dotnet-ai
spec:
  type: LoadBalancer
  selector:
    app: web-app1
    service: web-app1
  ports:
  - name: "5000"
    port: 5000
    targetPort: 5000
    protocol: TCP