services:

  agent-framework-quick-start:
    image: dotnet-ai/agent-framework-quick-start
    build:
      context: .
      dockerfile: src/AgentFrameworkQuickStart/Dockerfile
    container_name: agent-framework-quick-start
    ports:
    - "5200:5200"
    - "5201:5201"
    networks:
    - dotnet-ai-network
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=5200
      - ASPNETCORE_HTTPS_PORTS=5201
      - ASPNETCORE_URLS=http://+:5200;https://+:5201

  web-app:
    image: dotnet-ai/webapp
    build:
      context: .
      dockerfile: src/WebApp/Dockerfile
    container_name: webapp
    ports:
    - "5000:5000"
    - "5001:5001"
    networks:
    - dotnet-ai-network
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=5000
      - ASPNETCORE_HTTPS_PORTS=5001
      - ASPNETCORE_URLS=http://+:5000;https://+:5001
      - AgentFrameworkQuickStart__BaseUrl=http://agent-framework-quick-start:5200

networks:
  dotnet-ai-network:
    name: dotnet-ai-network
    driver: bridge
